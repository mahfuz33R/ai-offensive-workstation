name: Validate source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare safe local configuration
        run: |
          cp .env.example .env
          chmod 600 .env
          bash scripts/configure-host.sh

      - name: Run project preflight
        run: bash scripts/preflight.sh

      - name: Validate encrypted reuse tooling
        run: |
          bash scripts/reuse.sh --help >/dev/null
          test ! -e reuse.sh
          test ! -e reuse.md

      - name: Validate Zsh configuration
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          zsh -n .zshrc

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for credentials
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            git /repo --no-banner --redact \
            --config /repo/.gitleaks.toml
