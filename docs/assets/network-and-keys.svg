<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Ports and keys</title>
  <desc id="desc">SSH forwards local ports 9119 and 8642 to the remote workstation. The dashboard uses 9119, the authenticated Hermes API uses 8642, and CyberStrike remains internal on 4096.</desc>
  <defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#06142b"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker><style>.title{font:700 32px system-ui,sans-serif;fill:#fff}.h{font:700 19px system-ui,sans-serif;fill:#fff}.t{font:14px system-ui,sans-serif;fill:#e2e8f0}.small{font:13px system-ui,sans-serif;fill:#cbd5e1}.box{stroke-width:2;rx:18}.line{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="520" rx="24" fill="url(#b)"/><text x="45" y="58" class="title">Ports, tunnels and keys — three different jobs</text>
  <rect class="box" x="55" y="120" width="250" height="300" fill="#164e63" stroke="#67e8f9"/><text x="85" y="160" class="h">Local computer</text><text x="85" y="205" class="t">Browser</text><text x="85" y="235" class="t">curl / Postman / SDK</text><text x="85" y="285" class="small">SSH forwards traffic.</text><text x="85" y="315" class="small">It does not add API keys.</text>
  <rect class="box" x="410" y="105" width="730" height="330" fill="#172554" stroke="#818cf8"/><text x="445" y="145" class="h">Remote Docker network namespace</text>
  <rect class="box" x="460" y="190" width="190" height="165" fill="#075985" stroke="#7dd3fc"/><text x="488" y="228" class="h">Dashboard</text><text x="488" y="261" class="t">Port 9119</text><text x="488" y="293" class="small">Open in browser</text><text x="488" y="320" class="small">through SSH</text>
  <rect class="box" x="700" y="190" width="190" height="165" fill="#7c2d12" stroke="#fdba74"/><text x="728" y="228" class="h">Hermes API</text><text x="728" y="261" class="t">Port 8642</text><text x="728" y="293" class="small">Bearer API_SERVER_KEY</text><text x="728" y="320" class="small">API clients only</text>
  <rect class="box" x="940" y="190" width="160" height="165" fill="#581c87" stroke="#d8b4fe"/><text x="967" y="228" class="h">CyberStrike</text><text x="967" y="261" class="t">Port 4096</text><text x="967" y="293" class="small">Internal only</text><text x="967" y="320" class="small">MCP bridge</text>
  <path class="line" d="M305 210C365 210 385 245 460 245"/><path class="line" d="M305 300C385 300 620 270 700 270"/><path class="line" d="M890 270h50"/>
  <text x="55" y="475" class="small">Provider keys pay for model reasoning • API_SERVER_KEY protects Hermes HTTP • CyberStrike credentials protect its internal server • RAG needs none of them.</text>
</svg>
